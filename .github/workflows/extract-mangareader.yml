name: Extract MangaReader ZIP
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project into repository root
        run: |
          rm -rf /tmp/mr /tmp/mr-project
          mkdir -p /tmp/mr /tmp/mr-project
          unzip -q -o MangaReader.zip -d /tmp/mr
          unzip -q -o /tmp/mr/MangaReader.zip -d /tmp/mr-project
          cp -a /tmp/mr-project/. ./
          rm -rf /tmp/mr /tmp/mr-project MangaReader.zip hi .github/workflows/extract-mangareader.yml
      - name: Commit extracted project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract MangaReader project into repository' || exit 0
          git push
