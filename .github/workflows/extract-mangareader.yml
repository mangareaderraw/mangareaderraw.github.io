name: Extract MangaReader ZIP
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project into repository root
        run: |
          rm -rf /tmp/mr
          mkdir -p /tmp/mr
          unzip -q -o MangaReader.zip -d /tmp/mr
          if [ -f /tmp/mr/mangareader-package/MangaReader.zip ]; then
            rm -rf /tmp/mr/nested
            mkdir -p /tmp/mr/nested
            unzip -q -o /tmp/mr/mangareader-package/MangaReader.zip -d /tmp/mr/nested
            cp -a /tmp/mr/nested/. /tmp/mr/mangareader-package/
          fi
          cp -a /tmp/mr/mangareader-package/. ./
          rm -rf /tmp/mr MangaReader.zip hi .github/workflows/extract-mangareader.yml
      - name: Commit extracted project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract MangaReader project into repository' || exit 0
          git push
