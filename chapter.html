<style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px}.bar a{color:#b7bdc9;text-decoration:none}.title{font-weight:800}.views{color:#8b92a1;font-size:12px}.reader{max-width:820px;margin:auto}.page{display:block;width:100%;max-width:820px;height:auto;margin:0 auto;background:#111}.empty,.error{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b}.chapter-head{padding:24px 5%;text-align:center}.chapter-head h1{margin:0 0 8px;font-size:clamp(24px,4vw,42px)}.chapter-head p{margin:0;color:#8b92a1}.pages{display:flex;flex-direction:column;align-items:center;gap:0}.pages img{width:100%;max-width:820px;height:auto;display:block;background:#111;min-height:20px}.pages .img-error{padding:20px;text-align:center;color:#ff8c9b;font-size:13px}.back{color:#b7bdc9}.notice{padding:18px 5%;color:#9ea5b3;text-align:center}.chapter-ad{width:100%;max-width:820px;min-height:50px;margin:18px auto;text-align:center;display:flex;justify-content:center;align-items:center;overflow:hidden}.chapter-ad iframe{max-width:100%;border:0}.start-ad{width:100%;min-height:250px;margin:0 auto 22px;text-align:center;display:flex;justify-content:center;align-items:center;overflow:hidden}.start-ad iframe{max-width:100%;border:0}@media(max-width:850px){.reader,.page,.pages img,.chapter-ad{max-width:100%}}</style>
</head><body><header class="bar"><a class="back" id="back" href="/">← MangaReader</a><span class="title" id="title">Chapter</span><span class="views" id="views"></span></header><main id="reader"><div class="empty">Loading chapter...</div></main>
<script>
const cfg=window.MANGAREADER_CONFIG||{};const reader=document.getElementById('reader');const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
const decodeSlug=value=>{let s=String(value||'');for(let i=0;i<3;i++){try{const d=decodeURIComponent(s);if(d===s)break;s=d}catch{break}}return s};
const normalizePage=p=>{if(p&&typeof p==='object')return p;try{const x=JSON.parse(p);return x&&typeof x==='object'?x:{url:String(p)}}catch{return {url:String(p)}}};
function storagePathFromUrl(url){try{const u=new URL(String(url));const marker='/storage/v1/object/public/chapter-pages/';const i=u.pathname.indexOf(marker);return i>=0?decodeURIComponent(u.pathname.slice(i+marker.length)):''}catch{return ''}}
function publicPageUrl(p){const raw=String(p?.url||'');const path=String(p?.path||p?.storage_path||storagePathFromUrl(raw)||'');if(path&&cfg.SUPABASE_URL){return sb.storage.from('chapter-pages').getPublicUrl(path).data.publicUrl||raw}return raw}
const VIEW_COOLDOWN_MS=30*60*1000;function viewKey(id){return `mangareader:view:${id}`}async function registerView(id,current){const key=viewKey(id);let last=0;try{last=Number(localStorage.getItem(key)||0)}catch{}if(last&&Date.now()-last<VIEW_COOLDOWN_MS)return current;try{const {data,error}=await sb.rpc('increment_chapter_view',{p_chapter_id:id});if(error)throw error;const next=Array.isArray(data)?data[0]:data;if(next!==null&&next!==undefined){try{localStorage.setItem(key,String(Date.now()))}catch{}return Number(next)}}catch(e){console.warn('View count update failed',e)}return current}
const AD_UNITS=[{key:'a8a805cc341bb0537e9ecf27dd55a271',width:300,height:250},{key:'ce956904ebd6d4f505c512d6335bafb6',width:728,height:90},{key:'ce956904ebd6d4f505c512d6335bafb6',width:728,height:90},{key:'ae2c12c2824e95e7c0d146f3dc6a23c5',width:320,height:50}];
function addStartAd(parent){const wrap=document.createElement('div');wrap.className='start-ad';const opts=document.createElement('script');opts.textContent="atOptions = { 'key' : 'a8a805cc341bb0537e9ecf27dd55a271', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };";wrap.appendChild(opts);parent.appendChild(wrap);const script=document.createElement('script');script.async=true;script.src='https://www.highrevenueformat.com/a8a805cc341bb0537e9ecf27dd55a271/invoke.js';wrap.appendChild(script)}
function addInlineAd(parent,index){const ad=AD_UNITS[index];const wrap=document.createElement('div');wrap.className='chapter-ad';wrap.dataset.adIndex=String(index+1);wrap.style.minHeight=ad.height+'px';const opts=document.createElement('script');opts.textContent=`atOptions = { 'key' : '${ad.key}', 'format' : 'iframe', 'height' : ${ad.height}, 'width' : ${ad.width}, 'params' : {} };`;wrap.appendChild(opts);parent.appendChild(wrap);const script=document.createElement('script');script.async=true;script.src=`https://www.highrevenueformat.com/${ad.key}/invoke.js`;script.onerror=()=>console.warn('Ad failed:',ad.key);wrap.appendChild(script)}
function renderPages(pageRows,manga,data){const container=document.createElement('div');container.className='pages';const points=[Math.max(1,Math.ceil(pageRows.length*.25)),Math.max(1,Math.ceil(pageRows.length*.5)),Math.max(1,Math.ceil(pageRows.length*.75))];let adIndex=0;for(let i=0;i<pageRows.length;i++){const p=pageRows[i];const img=document.createElement('img');img.className='page';img.src=publicPageUrl(p);img.alt=p.alt||`${manga.title||'Manga'} Chapter ${data.chapter_number} page ${i+1}`;img.loading=i?'lazy':'eager';img.decoding='async';img.referrerPolicy='no-referrer';img.addEventListener('error',()=>{const retry=img.dataset.retry||'0';if(retry==='0'){img.dataset.retry='1';img.src=img.src+(img.src.includes('?')?'&':'?')+'v='+Date.now()}else{const msg=document.createElement('div');msg.className='img-error';msg.textContent='Image failed to load. Please refresh this chapter.';img.replaceWith(msg);console.warn('Chapter image failed:',p)}});container.appendChild(img);if(adIndex<3&&i+1===points[adIndex]){addInlineAd(container,adIndex);adIndex++}}if(adIndex<4)addInlineAd(container,3);return container}
async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){reader.innerHTML='<div class="error">Site configuration is incomplete. Connect Supabase first.</div>';return}const path=location.pathname.replace(/\/+$/,'');let slug=new URLSearchParams(location.search).get('slug')||'';if(!slug){const m=path.match(/^\/chapter\/(.+)$/);if(m)slug=decodeSlug(m[1])}if(!slug){reader.innerHTML='<div class="error">Chapter not found.</div>';return}const {data,error}=await sb.from('chapters').select('id,chapter_number,title,url_slug,pages,view_count,manga(id,title,slug,cover_url)').eq('url_slug',slug).single();if(error||!data){reader.innerHTML='<div class="error">Chapter not found.</div>';return}const manga=data.manga||{};const pageRows=(data.pages||[]).map(normalizePage).filter(p=>p.url);const analyticsTitle=`${manga.title||'Manga'} — Chapter ${data.chapter_number} | MangaReader`;document.title=analyticsTitle;document.getElementById('canonical').href=`/chapter.html?slug=${encodeURIComponent(data.url_slug)}`;document.getElementById('title').textContent=`${manga.title||'Manga'} · Chapter ${data.chapter_number}`;document.getElementById('views').textContent=`👁 ${Number(data.view_count||0).toLocaleString()} views`;document.getElementById('back').href=manga.slug?`/manga.html?slug=${encodeURIComponent(manga.slug)}`:'/';reader.innerHTML='';const head=document.createElement('section');head.className='chapter-head';head.innerHTML=`<h1>${esc(manga.title||'Manga')} — Chapter ${esc(data.chapter_number)}${data.title?` · ${esc(data.title)}`:''}</h1><p>${pageRows.length} page${pageRows.length===1?'':'s'}</p>`;reader.appendChild(head);addStartAd(reader);if(pageRows.length){reader.appendChild(renderPages(pageRows,manga,data))}else{reader.innerHTML+='<div class="empty">No chapter pages have been uploaded yet.</div>'}const notice=document.createElement('div');notice.className='notice';notice.textContent='MangaReader is a manga discovery platform. Please use official/legal sources where applicable.';reader.appendChild(notice);gtag('event','page_view',{page_title:analyticsTitle,page_location:location.href,page_path:location.pathname+location.search});const newCount=await registerView(data.id,Number(data.view_count||0));document.getElementById('views').textContent=`👁 ${newCount.toLocaleString()} views`}
init();
</script></body></html>
