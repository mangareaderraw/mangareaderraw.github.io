<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="description" content="MangaReader chapter page with manga chapter information and uploaded pages.">
<link id="canonical" rel="canonical" href="/chapter.html"><title>Chapter | MangaReader</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V95GCWF3LD"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-V95GCWF3LD',{send_page_view:false});</script>
<script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script async src="https://pl31184852.profitableratecpmnetwork.com/fc/74/ba/fc74ba94a855427d9acf396c1acc96c5.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px}.bar a{color:#b7bdc9;text-decoration:none}.title{font-weight:800}.views{color:#8b92a1;font-size:12px}.reader{max-width:820px;margin:auto}.page{display:block;width:100%;max-width:820px;height:auto;margin:0 auto;background:#111}.empty,.error{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b}.chapter-head{padding:24px 5%;text-align:center}.chapter-head h1{margin:0 0 8px;font-size:clamp(24px,4vw,42px)}.chapter-head p{margin:0;color:#8b92a1}.pages{display:flex;flex-direction:column;align-items:center;gap:0}.pages img{width:100%;max-width:820px;height:auto;display:block;background:#111}.back{color:#b7bdc9}.notice{padding:18px 5%;color:#9ea5b3;text-align:center}.chapter-ad{width:100%;max-width:820px;min-height:50px;margin:18px auto;text-align:center;display:flex;justify-content:center;align-items:center;overflow:hidden}.chapter-ad iframe{max-width:100%;border:0}@media(max-width:850px){.reader,.page,.pages img,.chapter-ad{max-width:100%}}</style>
</head><body><header class="bar"><a class="back" id="back" href="/">← MangaReader</a><span class="title" id="title">Chapter</span><span class="views" id="views"></span></header><main id="reader"><div class="empty">Loading chapter...</div></main>
<script>
const cfg=window.MANGAREADER_CONFIG||{};
const reader=document.getElementById('reader');
const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
const decodeSlug=value=>{let s=String(value||'');for(let i=0;i<3;i++){try{const d=decodeURIComponent(s);if(d===s)break;s=d}catch{break}}return s};
const normalizePage=p=>{if(p&&typeof p==='object')return p;try{const x=JSON.parse(p);return x&&typeof x==='object'?x:{url:String(p)}}catch{return {url:String(p)}}};
const VIEW_COOLDOWN_MS=30*60*1000;
function viewKey(chapterId){return `mangareader:view:${chapterId}`}
async function registerView(chapterId,currentCount){const key=viewKey(chapterId);let last=0;try{last=Number(localStorage.getItem(key)||0)}catch{}if(last&&Date.now()-last<VIEW_COOLDOWN_MS)return currentCount;try{const {data,error}=await sb.rpc('increment_chapter_view',{p_chapter_id:chapterId});if(error)throw error;const next=Array.isArray(data)?data[0]:data;if(next!==null&&next!==undefined){try{localStorage.setItem(key,String(Date.now()))}catch{}return Number(next)}}catch(e){console.warn('View count update failed',e)}return currentCount}
const AD_UNITS=[{key:'7ef64e6edb682c1c720538302616cca6',width:320,height:50},{key:'b71712c4ba05fa65a7dd672049e9e0a5',width:728,height:90},{key:'b7d97363fe79d92b77435277a7a2212c',width:468,height:60}];
function addAdUnit(parent,index){return new Promise(resolve=>{const ad=AD_UNITS[index];const wrap=document.createElement('div');wrap.className='chapter-ad';wrap.dataset.adIndex=String(index+1);wrap.style.minHeight=ad.height+'px';const opts=document.createElement('script');opts.textContent=`atOptions = { 'key' : '${ad.key}', 'format' : 'iframe', 'height' : ${ad.height}, 'width' : ${ad.width}, 'params' : {} };`;wrap.appendChild(opts);const script=document.createElement('script');script.src=`https://www.highrevenueformat.com/${ad.key}/invoke.js`;script.onload=()=>resolve();script.onerror=()=>resolve();wrap.appendChild(script);parent.appendChild(wrap)})}
async function renderPagesWithAds(pageRows,manga,data){const container=document.createElement('div');container.className='pages';const total=pageRows.length;const positions=[Math.max(1,Math.floor(total/4)),Math.max(1,Math.floor(total/2)),Math.max(1,Math.floor(total*3/4))];let adIndex=0;for(let i=0;i<total;i++){const p=pageRows[i];const img=document.createElement('img');img.className='page';img.src=p.url;img.alt=p.alt||`${manga.title||'Manga'} Chapter ${data.chapter_number} page ${i+1}`;img.loading=i?'lazy':'eager';img.decoding='async';container.appendChild(img);if(adIndex<3&&i+1>=positions[adIndex]){await addAdUnit(container,adIndex);adIndex++}}while(adIndex<3&&total){await addAdUnit(container,adIndex);adIndex++}return container}
async function init(){
if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){reader.innerHTML='<div class="error">Site configuration is incomplete. Connect Supabase first.</div>';return}
const path=location.pathname.replace(/\/+$/,'');let slug=new URLSearchParams(location.search).get('slug')||'';if(!slug){const m=path.match(/^\/chapter\/(.+)$/);if(m)slug=decodeSlug(m[1])}if(!slug){reader.innerHTML='<div class="error">Chapter not found.</div>';return}
const {data,error}=await sb.from('chapters').select('id,chapter_number,title,url_slug,pages,view_count,manga(id,title,slug,cover_url)').eq('url_slug',slug).single();if(error||!data){reader.innerHTML='<div class="error">Chapter not found.</div>';return}
const manga=data.manga||{};const pageRows=(data.pages||[]).map(normalizePage).filter(p=>p.url);const analyticsTitle=`${manga.title||'Manga'} — Chapter ${data.chapter_number} | MangaReader`;document.title=analyticsTitle;document.getElementById('canonical').href=`/chapter.html?slug=${encodeURIComponent(data.url_slug)}`;document.getElementById('title').textContent=`${manga.title||'Manga'} · Chapter ${data.chapter_number}`;document.getElementById('views').textContent=`👁 ${Number(data.view_count||0).toLocaleString()} views`;document.getElementById('back').href=manga.slug?`/manga.html?slug=${encodeURIComponent(manga.slug)}`:'/';
reader.innerHTML='';const head=document.createElement('section');head.className='chapter-head';head.innerHTML=`<h1>${esc(manga.title||'Manga')} — Chapter ${esc(data.chapter_number)}${data.title?` · ${esc(data.title)}`:''}</h1><p>${pageRows.length} page${pageRows.length===1?'':'s'}</p>`;reader.appendChild(head);
if(pageRows.length){reader.appendChild(await renderPagesWithAds(pageRows,manga,data))}else{reader.innerHTML+='<div class="empty">No chapter pages have been uploaded yet.</div>'}
const notice=document.createElement('div');notice.className='notice';notice.textContent='MangaReader is a manga discovery platform. Please use official/legal sources where applicable.';reader.appendChild(notice);
gtag('event','page_view',{page_title:analyticsTitle,page_location:location.href,page_path:location.pathname+location.search});
const newCount=await registerView(data.id,Number(data.view_count||0));document.getElementById('views').textContent=`👁 ${newCount.toLocaleString()} views`;
}
init();
</script></body></html>
