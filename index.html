<header class="hero">
<h1>日本のマンガを見つけよう。</h1>
<p>日本のマンガ作品、最新話、新刊情報をまとめてチェックできます。</p>
</header>
<main id="countrySections" class="section">
<div id="japan" class="country-row"><div class="country-head"><div class="country-title">🇯🇵 日本</div><div class="country-line"></div><div class="country-count">最新20話</div></div><div id="JP-grid" class="latest-grid"><div class="loading">最新話を読み込んでいます...</div></div><div id="JP-pagination" class="pagination"></div></div>
</main>
<footer class="footer"><span>© 2026 MangaReader</span><span><a href="/japan-blog.html">日本ブログ</a> · <a href="/sitemap.xml">サイトマップ</a></span></footer>
<script>
const sb=supabase.createClient(window.MANGAREADER_CONFIG.SUPABASE_URL,window.MANGAREADER_CONFIG.SUPABASE_ANON_KEY);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');
const PAGE_SIZE=20;
const country={name:'日本',grid:'JP-grid',pagination:'JP-pagination'};
let page=1;
async function loadJapan(nextPage=1){
 page=nextPage;
 const grid=document.getElementById(country.grid),pager=document.getElementById(country.pagination);
 grid.innerHTML='<div class="loading">最新話を読み込んでいます...</div>'; pager.innerHTML='';
 const from=(page-1)*PAGE_SIZE,to=from+PAGE_SIZE-1;
 const {data,error,count}=await sb.from('chapters').select('chapter_number,url_slug,created_at,view_count,manga!inner(title,cover_url,country,language)',{count:'exact'}).eq('manga.country','JP').eq('manga.language','ja').order('created_at',{ascending:false}).range(from,to);
 if(error||!data?.length){grid.innerHTML='<div class="empty">公開されている最新話はまだありません。</div>';return}
 grid.innerHTML=data.map(c=>`<a class="latest-item" href="/chapter.html?slug=${encodeURIComponent(c.url_slug)}"><img src="${esc(c.manga?.cover_url||'https://placehold.co/300x400')}" alt="${esc(c.manga?.title||'マンガ')}" loading="lazy" decoding="async"><div><strong>${esc(c.manga?.title||'')} <span class="chapter-number">・第${esc(c.chapter_number)}話</span></strong><p>${new Date(c.created_at).toLocaleDateString('ja-JP')} ・ 👁 ${Number(c.view_count||0).toLocaleString('ja-JP')}</p></div></a>`).join('');
 const totalPages=Math.max(1,Math.ceil((count||0)/PAGE_SIZE));
 if(totalPages>1) pager.innerHTML=`<button class="page-btn" ${page<=1?'disabled':''} onclick="loadJapan(${page-1})">← 前へ</button><span class="page-info">${page} / ${totalPages} ページ</span><button class="page-btn" ${page>=totalPages?'disabled':''} onclick="loadJapan(${page+1})">次へ →</button>`;
}
loadJapan(1);
</script>
